name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run test suite
        run: python -m unittest discover -s tests -v
      - name: verify README example output is fresh
        run: python build_readme.py && git diff --exit-code -- README.md
